<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">黄雀 AI 微信小程序</title>
  <desc id="desc">黄雀 AI 微信小程序的深色玫红品牌首图，展示 IP12、AI 作图、视频创作和声音克隆能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090711"/>
      <stop offset="0.55" stop-color="#150b1e"/>
      <stop offset="1" stop-color="#070913"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fb6"/>
      <stop offset="0.48" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#ff8a5b"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="30" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="145" fill="#b124ff" opacity="0.18" filter="url(#blur)"/>
  <circle cx="710" cy="430" r="170" fill="#ff3d99" opacity="0.13" filter="url(#blur)"/>
  <path d="M0 354C185 304 286 405 455 352S716 275 890 326s210 36 310 4v130H0z" fill="#d946ef" opacity="0.045"/>

  <g transform="translate(72 70)">
    <g>
      <rect width="58" height="58" rx="18" fill="url(#brand)"/>
      <path d="M16 33c13-2 22-8 27-20 3 14-3 26-16 31-5 2-10 1-14-1 7-1 11-4 14-8-5 2-9 2-11-2z" fill="#fff" opacity="0.96"/>
    </g>
    <text x="78" y="21" fill="#f6effa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" letter-spacing="2">HUANGQUE AI</text>
    <text x="78" y="47" fill="#9f94ad" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14">WECHAT MINI PROGRAM</text>

    <text x="0" y="125" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="54" font-weight="800">黄雀 AI 微信小程序</text>
    <text x="0" y="171" fill="#cfc4d8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="22">把灵感、人设、图片、声音和视频，装进一条移动创作链路</text>

    <g transform="translate(0 216)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="650">
      <g><rect width="104" height="38" rx="19" fill="#ffffff" opacity="0.075" stroke="#ff69ba" stroke-opacity="0.34"/><circle cx="20" cy="19" r="5" fill="#ff69ba"/><text x="34" y="25" fill="#f8edf5">IP12</text></g>
      <g transform="translate(116)"><rect width="122" height="38" rx="19" fill="#ffffff" opacity="0.075" stroke="#cf70ff" stroke-opacity="0.34"/><circle cx="20" cy="19" r="5" fill="#cf70ff"/><text x="34" y="25" fill="#f8edf5">AI 作图</text></g>
      <g transform="translate(250)"><rect width="132" height="38" rx="19" fill="#ffffff" opacity="0.075" stroke="#7d8cff" stroke-opacity="0.34"/><circle cx="20" cy="19" r="5" fill="#7d8cff"/><text x="34" y="25" fill="#f8edf5">视频创作</text></g>
      <g transform="translate(394)"><rect width="132" height="38" rx="19" fill="#ffffff" opacity="0.075" stroke="#ffad64" stroke-opacity="0.34"/><circle cx="20" cy="19" r="5" fill="#ffad64"/><text x="34" y="25" fill="#f8edf5">配音克隆</text></g>
    </g>

    <g transform="translate(0 292)">
      <rect width="4" height="42" rx="2" fill="url(#gold)"/>
      <text x="18" y="16" fill="#f2eaf6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="700">Native Mini Program · JavaScript · TDesign</text>
      <text x="18" y="39" fill="#8f849d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13">移动端入口 · 统一账号 · 点数任务 · 作品资产</text>
    </g>
  </g>

  <g transform="translate(790 42)" filter="url(#shadow)">
    <rect width="326" height="376" rx="42" fill="#17111f" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="15" y="15" width="296" height="346" rx="31" fill="#0e0b15"/>
    <rect x="118" y="26" width="90" height="8" rx="4" fill="#34283f"/>
    <text x="37" y="76" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="750">创作工作台</text>
    <text x="37" y="99" fill="#887d94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12">从想法到作品，随时继续</text>

    <g transform="translate(36 122)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
      <g><rect width="120" height="78" rx="18" fill="#25152d" stroke="#ff5fb6" stroke-opacity="0.25"/><circle cx="25" cy="25" r="11" fill="#ff5fb6" opacity="0.9"/><text x="17" y="30" fill="#fff" font-size="13" font-weight="800">灵</text><text x="18" y="58" fill="#f7eaf2" font-size="14" font-weight="700">一键跟创</text></g>
      <g transform="translate(134)"><rect width="120" height="78" rx="18" fill="#20172e" stroke="#b56cff" stroke-opacity="0.25"/><circle cx="25" cy="25" r="11" fill="#b56cff" opacity="0.9"/><text x="17" y="30" fill="#fff" font-size="13" font-weight="800">图</text><text x="18" y="58" fill="#f7eaf2" font-size="14" font-weight="700">AI 作图</text></g>
      <g transform="translate(0 92)"><rect width="120" height="78" rx="18" fill="#171d30" stroke="#7187ff" stroke-opacity="0.25"/><circle cx="25" cy="25" r="11" fill="#7187ff" opacity="0.9"/><text x="17" y="30" fill="#fff" font-size="13" font-weight="800">影</text><text x="18" y="58" fill="#f7eaf2" font-size="14" font-weight="700">视频创作</text></g>
      <g transform="translate(134 92)"><rect width="120" height="78" rx="18" fill="#2c2017" stroke="#ffad64" stroke-opacity="0.25"/><circle cx="25" cy="25" r="11" fill="#ffad64" opacity="0.9"/><text x="17" y="30" fill="#fff" font-size="13" font-weight="800">声</text><text x="18" y="58" fill="#f7eaf2" font-size="14" font-weight="700">配音克隆</text></g>
    </g>

    <g transform="translate(36 310)">
      <rect width="254" height="34" rx="17" fill="url(#brand)" opacity="0.92"/>
      <text x="127" y="23" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="750">继续创作 · 作品自动回到资产库</text>
    </g>
  </g>
</svg>
