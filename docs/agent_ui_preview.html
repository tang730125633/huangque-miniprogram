            <button onclick="submitBatchSelections()" class="w-full bg-[#007AFF] hover:bg-blue-600 active:scale-[0.98] text-white font-semibold text-xs py-2.5 rounded-xl shadow-xs transition">

  </main>

  <!-- Dynamic Rendering Engine & Preset Data Script -->

    let expandedBodies = {};

    // =========================================================================

      const state = currentPayload;
      
      // 1. Render Greeting
      const greetingEl = document.getElementById("agent-greeting-text");
      if (greetingEl) {
        greetingEl.textContent = state.greeting || "请选择下方的配置方案：";
      }

      const taskBar = document.getElementById("dynamic-task-bar");
      const widgets = state.widgets || [];
      const task = state.task || {};
      const taskId = task.id || "01";
      const taskTitle = task.title || "方案建议准备就绪";
      const taskSummary = task.desc || widgets.map(w => w.title).join(" · ");
      const widgetsCount = widgets.length;

      taskBar.innerHTML = `
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="px-2.5 py-0.5 rounded-md bg-[#007AFF] text-white text-[10.5px] font-bold tracking-wide flex-shrink-0">
            #${taskId.replace(/^TASK-/, '')}
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-[13.5px] font-bold text-[#1C1C1E] truncate">${taskTitle}</span>
              <span class="text-[10px] font-semibold text-[#007AFF] bg-blue-50 px-2 py-0.2 rounded-full border border-blue-100 flex-shrink-0">${widgetsCount} 项待选</span>
            </div>
            <div class="text-[10.5px] text-stone-500 truncate mt-0.5">
              ${taskCollapsed ? '方案已收起 · 点击展开 ' + widgetsCount + ' 项组件卡' : taskSummary}
            </div>
          </div>
        </div>
        <div class="flex items-center gap-1 flex-shrink-0">
          <span class="text-[11px] font-semibold text-[#007AFF] bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-full shadow-xs">
            ${taskCollapsed ? '展开 ▾' : '收起 ▴'}
          </span>
        </div>
      `;

      // 3. Render Dynamic Widgets Container
      const widgetsContainer = document.getElementById("dynamic-widgets-container");
      if (taskCollapsed) {
        widgetsContainer.innerHTML = "";
        widgetsContainer.classList.add("hidden");
        document.getElementById("unified-confirm-bar").classList.add("hidden");
        return;
      }

      widgetsContainer.classList.remove("hidden");
      let html = "";

      widgets.forEach((widget, wIdx) => {
        const isVoiceSample = widget.type === "voice_sample";
        const isMulti = widget.selection_mode === "multiple";
        const selectedId = widget.selectedId;
        const selectedIds = widget.selectedIds || [];
        const items = widget.items || [];
        const actions = widget.actions || [];

        // Determine icon based on widget type (SF Symbols pure SVG)
        let iconSvg = "";
        if (widget.type === "voice_pick") {
          iconSvg = `<svg class="w-4 h-4 stroke-[#1C1C1E]" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v4"/></svg>`;
        } else if (widget.type === "avatar_pick") {
          iconSvg = `<svg class="w-4 h-4 stroke-[#1C1C1E]" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
        } else if (isVoiceSample) {
          iconSvg = `<svg class="w-4 h-4 stroke-[#1C1C1E]" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/></svg>`;
        } else {
          iconSvg = `<svg class="w-4 h-4 stroke-[#1C1C1E]" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 2.5h8l4 4V21H6a2 2 0 0 1-2-2V4.5a2 2 0 0 1 2-2z"/><path d="M14 2.5v5h4M8 12h6M8 16h6"/></svg>`;
        }

        // Answered status check
        let answeredTitle = "";
        if (isMulti) {
          answeredTitle = selectedIds.length ? `${selectedIds.length} 项已勾选` : "";
        } else if (selectedId) {
          const found = items.find(i => i.id === selectedId);
          if (found) answeredTitle = found.title.split(/[(（]/)[0].trim();
        }

        html += `
          <div class="bg-white rounded-2xl border border-stone-200/90 ios-card-shadow overflow-hidden">
            
            <!-- Card Header -->
            <div class="px-3.5 pt-3.5 pb-2.5 flex items-center justify-between border-b border-stone-100">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-stone-100 flex items-center justify-center flex-shrink-0">
                  ${iconSvg}
                </div>
                <div>
                  <h3 class="text-[14px] font-bold text-[#1C1C1E] tracking-tight">${widget.title}</h3>
                  <p class="text-[10.5px] text-stone-500">${widget.hint || ''}</p>
                </div>
              </div>
              <span class="text-[10.5px] font-semibold text-[#007AFF] bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100 flex-shrink-0">
                ${answeredTitle ? '✓ ' + answeredTitle : items.length ? items.length + ' 项可选' : '操作卡'}
              </span>
            </div>
            
            <!-- Card Body / Options List -->
            <div class="p-2.5 space-y-2">
        `;

        // Case A: Voice Sample Script Card
        if (isVoiceSample) {
          html += `
            <div class="p-3 rounded-2xl bg-stone-50 border border-stone-200/80">
              <div class="flex items-center justify-between text-[11px] font-bold text-stone-700 mb-1">
                <span>标准跟读文稿</span>
                <span class="text-stone-400 font-normal">建议朗读 15~30 秒</span>
              </div>
              <div class="text-[12.5px] text-stone-800 leading-relaxed">${widget.script || ''}</div>
            </div>
          `;
        }

        // Case B: Standard Options (Single/Multiple)
        items.forEach((item, itemIdx) => {
          const isSelected = isMulti ? selectedIds.includes(item.id) : selectedId === item.id;
          
          // Parse tag from title if not separated
          let parsedName = item.title;
          let parsedTag = item.summary || "";
          const match = item.title.match(/^([^(（·\s]+)[(（·\s]+([^()）\s]+)[)）]?$/);
          if (match) {
            parsedName = match[1].trim();
            parsedTag = match[2].trim();
          }

          // Check long body expand
          const bodyKey = `${widget.id}_${item.id}`;
          const isBodyExpanded = !!expandedBodies[bodyKey];
          const hasLongBody = item.body && item.body.length > 50;

          html += `
            <div onclick="handleOptionClick('${widget.id}', '${item.id}', ${isMulti})" class="cursor-pointer transition-all duration-200 p-3 rounded-2xl border ${isSelected ? 'border-2 border-[#007AFF] bg-blue-50/25 shadow-xs' : 'border-stone-200 bg-white hover:border-blue-200'} flex items-start justify-between gap-3">
              
              <!-- Left: Image Thumb or Audio Play -->
              ${item.image_url ? `
                <img src="${item.image_url}" class="w-12 h-12 rounded-xl object-cover border border-stone-200 flex-shrink-0" alt="avatar">
              ` : widget.type === 'voice_pick' ? `
                <button onclick="event.stopPropagation(); togglePlayAudio('${item.id}')" class="w-9 h-9 rounded-full ${playingAudioId === item.id ? 'bg-[#007AFF] text-white pulse-glow' : 'bg-blue-50 text-[#007AFF] border border-blue-200'} flex items-center justify-center flex-shrink-0 mt-0.5">
                  ${playingAudioId === item.id ? `
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                  ` : `
                    <svg class="w-3.5 h-3.5 fill-current ml-0.5" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  `}
                </button>
              ` : ''}

              <!-- Center: Text Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[13.5px] font-bold ${isSelected ? 'text-[#1C1C1E]' : 'text-stone-800'}">${parsedName}</span>
                  ${parsedTag ? `<span class="text-[10px] font-semibold text-stone-600 bg-stone-100 px-1.5 py-0.5 rounded-md">${parsedTag}</span>` : ''}
                </div>
                
                ${item.body ? `
                  <div class="text-[12px] text-stone-600 mt-1 leading-relaxed ${hasLongBody && !isBodyExpanded ? 'line-clamp-2' : ''}">
                    ${item.body}
                  </div>
                  ${hasLongBody ? `
                    <div onclick="event.stopPropagation(); toggleBodyExpand('${bodyKey}')" class="inline-flex items-center text-[10.5px] font-semibold text-[#007AFF] mt-1 hover:underline">
                      ${isBodyExpanded ? '收起 ▴' : '展开全文 ▾'}
                    </div>
                  ` : ''}
                ` : ''}
              </div>

              <!-- Right: Selection Indicator (Apple HIG Checkmark) -->
              <div class="flex-shrink-0 mt-0.5">
                ${isMulti ? `
                  <div class="w-5 h-5 rounded-md ${isSelected ? 'bg-[#007AFF] border border-[#007AFF]' : 'border-2 border-stone-300 bg-white'} flex items-center justify-center">
                    ${isSelected ? '<span class="text-white text-xs font-bold">✓</span>' : ''}
                  </div>
                ` : `
                  <div class="w-5 h-5 rounded-full ${isSelected ? 'bg-[#007AFF] border border-[#007AFF]' : 'border-2 border-[#C7C7CC] bg-white'} flex items-center justify-center shadow-xs">
                    ${isSelected ? `
                      <svg class="w-3 h-3 text-white stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                      </svg>
                    ` : ''}
                  </div>
                `}
              </div>

            </div>
          `;
        });

        // Case C: Widget Action Buttons (e.g. 克隆音频 / 定制数字人 / 重写文案)
        if (actions.length) {
          html += `<div class="pt-1 flex flex-wrap gap-2">`;
          actions.forEach(act => {
            html += `
              <button onclick="triggerWidgetAction('${widget.id}', '${act.label}', '${act.prompt || ''}')" class="flex-1 min-w-[120px] bg-stone-50 hover:bg-stone-100 active:scale-[0.98] border border-stone-200 text-stone-700 font-semibold text-xs py-2 px-3 rounded-xl transition flex items-center justify-center gap-1">
                <span>${act.label}</span>
              </button>
            `;
          });
          html += `</div>`;
        }

        html += `
            </div>
          </div>
        `;
      });

      widgetsContainer.innerHTML = html;

      // Show/Hide Unified Batch Confirm Button if multiple items are checked
      const confirmBar = document.getElementById("unified-confirm-bar");
      const hasAnyMulti = widgets.some(w => w.selection_mode === "multiple" && (w.selectedIds || []).length > 0);
      if (hasAnyMulti) {
        confirmBar.classList.remove("hidden");
      } else {
        confirmBar.classList.add("hidden");
      }
    }

    // =========================================================================
    // 4. INTERACTIVE HANDLERS (触发点选、展开、日志输出与消息回传)
    // =========================================================================
    function handleOptionClick(widgetId, itemId, isMulti) {
      const widget = (currentPayload.widgets || []).find(w => w.id === widgetId);
      if (!widget) return;

      const item = (widget.items || []).find(i => i.id === itemId);
      const itemTitle = item ? item.title : itemId;

      if (isMulti) {
        widget.selectedIds = widget.selectedIds || [];
        const idx = widget.selectedIds.indexOf(itemId);
        if (idx >= 0) {
          widget.selectedIds.splice(idx, 1);
          logProtocol(`[多选取消] ${widget.title}：取消勾选 ${itemTitle}`);
        } else {
          widget.selectedIds.push(itemId);
          logProtocol(`[多选勾选] ${widget.title}：勾选 ${itemTitle}`);
        }
      } else {
        widget.selectedId = itemId;
        logProtocol(`[Agent 点选上报] 【点选】${widget.title}：${itemTitle}（id=${itemId}）`);
      }

      // Sync JSON textarea
      updateEditorText();
      renderApp();
    }

    function toggleTaskGroupCollapse() {
      taskCollapsed = !taskCollapsed;
      logProtocol(`[任务折叠切换] 任务栏状态变为: ${taskCollapsed ? '已收起' : '已展开'}`);
      renderApp();
    }

    function togglePlayAudio(audioId) {
      if (playingAudioId === audioId) {
        playingAudioId = null;
        logProtocol(`[音频试听] 暂停播放: ${audioId}`);
      } else {
        playingAudioId = audioId;
        logProtocol(`[音频试听] 开始播放样音: ${audioId}`);
      }
      renderApp();
    }

    function toggleBodyExpand(key) {
      expandedBodies[key] = !expandedBodies[key];
      renderApp();
    }

    function triggerWidgetAction(widgetId, label, prompt) {
      logProtocol(`[动作指令触发] 卡片[${widgetId}] 执行「${label}」 => 发送指令: "${prompt || label}"`);
      alert(`已向黄雀发送指令: "${prompt || label}"\nAgent 将会在对话中继续生成后续内容！`);
    }

    function submitBatchSelections() {
      const lines = [];
      (currentPayload.widgets || []).forEach(w => {
        if (w.selection_mode === "multiple" && (w.selectedIds || []).length) {
          const names = w.selectedIds.map(id => {
            const item = (w.items || []).find(i => i.id === id);
            return item ? item.title.split(/[(（]/)[0].trim() : id;
          });
          lines.push(`【点选】${w.title}：${names.join('、')}`);
        }
      });
      const msg = lines.join('\n');
      logProtocol(`[批量提交指令] 整合发送至黄雀:\n${msg}`);
      alert(`已一次性提交多选项给黄雀：\n\n${msg}`);
    }

    function logProtocol(text) {
      const logEl = document.getElementById("protocol-log");
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.className = "text-slate-800 flex items-start gap-1";
      div.innerHTML = `<span class="text-blue-500 font-bold flex-shrink-0">[${time}]</span> <span class="break-all">${text}</span>`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // =========================================================================
    // 5. JSON EDITOR CONTROLS
    // =========================================================================
    function updateEditorText() {
      document.getElementById("json-editor").value = JSON.stringify(currentPayload, null, 2);
    }

    function applyJSON() {
      try {
        const val = document.getElementById("json-editor").value;
        const parsed = JSON.parse(val);
        currentPayload = parsed;
        logProtocol(`[控制台更新] 成功载入并渲染自定义 Agent JSON 数据 (${currentPayload.widgets ? currentPayload.widgets.length : 0} 张卡片)`);
        renderApp();
      } catch (err) {
        alert("JSON 语法解析错误，请检查格式是否正确！\n" + err.message);
      }
    }

    function formatJSON() {
      try {
        const val = document.getElementById("json-editor").value;
        document.getElementById("json-editor").value = JSON.stringify(JSON.parse(val), null, 2);
      } catch (err) {
        alert("格式化失败：无效的 JSON 字符串");
      }
    }

    function loadPreset(key) {
      if (!PRESETS[key]) return;
      currentPayload = JSON.parse(JSON.stringify(PRESETS[key]));
      taskCollapsed = false;
      playingAudioId = null;
      expandedBodies = {};
      updateEditorText();
      logProtocol(`[预设载入] 切换到场景: ${PRESETS[key].task ? PRESETS[key].task.title : key}`);
      renderApp();
    }

    function resetCurrentPreset() {
      loadPreset('video3');
    }

    // Init on page load
    window.addEventListener("DOMContentLoaded", () => {
      updateEditorText();
      renderApp();
      logProtocol(`[系统就绪] 黄雀 Agent 动态组件渲染引擎已启动 (Apple HIG 规范已就绪)`);
    });
  </script>
</body>
</html>
